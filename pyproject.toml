[project]
name = "cs6350-stereo-depth-estimation"
version = "0.1.0"
description = "CS6350 TPA-2: Comparison of shallow and deep stereo depth estimation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "opencv-python>=4.8",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
    "imageio>=2.31",
]

[project.optional-dependencies]
gpu = [
    "torch>=2.1,<3",
    "torchvision>=0.16,<1",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short -p no:launch_testing -p no:launch_pytest -p no:launch_ros -p no:ament_black -p no:ament_xmllint -p no:ament_lint -p no:ament_copyright -p no:ament_pep257 -p no:ament_mypy -p no:ament_flake8"

[tool.uv]
# Use system PyTorch (cu121) — don't re-download from PyPI
# Add torch index only if needed: [[tool.uv.index]] url = "https://download.pytorch.org/whl/cu121"
